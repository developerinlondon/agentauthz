name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      # The whole suite, including the storage-backed conformance runner — the
      # same gate the release runs, so a tag can never be the first time these
      # execute against a change.
      - run: bun test

      # dist/ is committed so the package installs straight from git. A stale
      # dist ships source that does not match the tag, and the only symptom is
      # a consumer missing an export — so the build output is a review artefact
      # like any other, and CI refuses a diff.
      - name: dist is current
        run: |
          bun run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale — run 'bun run build' and commit the result" >&2
            git diff --stat -- dist >&2
            exit 1
          fi
